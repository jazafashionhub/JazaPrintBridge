name: Build Jaza Print Bridge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o JazaPrintBridge.zip
          echo "Extracted project:"
          ls -la
          find JazaPrintBridge -maxdepth 3 -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: JazaPrintBridge
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JazaPrintBridge-APK
          path: JazaPrintBridge/app/build/outputs/apk/debug/*.apk
