name: Build Jaza Print Bridge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o JazaPrintBridge.zip

          echo "===== PROJECT STRUCTURE ====="
          find . -maxdepth 5 -type f \( -name "gradlew" -o -name "gradle-wrapper.properties" -o -name "build.gradle" \)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find . -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)
          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build APK
        run: |
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          gradle --version

          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JazaPrintBridge-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
