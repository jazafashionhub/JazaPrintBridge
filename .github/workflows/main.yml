name: Build Jaza Print Bridge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o JazaPrintBridge.zip

          echo "Project files:"
          ls -la JazaPrintBridge

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Gradle version
        working-directory: JazaPrintBridge
        run: |
          sed -i 's/gradle-[0-9.]*-\(all\|bin\)\.zip/gradle-8.9-\1.zip/' gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

      - name: Build APK
        working-directory: JazaPrintBridge
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JazaPrintBridge-APK
          path: JazaPrintBridge/app/build/outputs/apk/debug/*.apk
