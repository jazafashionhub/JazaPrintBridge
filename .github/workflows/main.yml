name: Build Jaza Print Bridge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o JazaPrintBridge.zip

          echo "===== PROJECT FILES ====="
          find . -maxdepth 5 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "gradlew" \)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Enable AndroidX
        run: |
          mkdir -p "$PROJECT_DIR"

          touch "$PROJECT_DIR/gradle.properties"

          grep -qxF "android.useAndroidX=true" "$PROJECT_DIR/gradle.properties" || \
            echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"

          grep -qxF "android.enableJetifier=true" "$PROJECT_DIR/gradle.properties" || \
            echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

          echo "===== gradle.properties ====="
          cat "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        run: |
          echo "Building from: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle --version

          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JazaPrintBridge-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
